<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log out</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="outras-tela.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="forulario">
                <h1>Login</h1>
                <p>
                Seja bem vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurções no seu ambiente
                </p>
                <form action="index.html" method="post">
                    <div class="capo">
                        <span class="material-symbols-outlined">
                            person
                        </span>
                        <input type="email" name="email" id="iemail" required maxlength="30" placeholder="seu e-mail">
                        <label for="iemail">e-mail</label>
                    </div>
                    <div class="capo">
                        <span class="material-symbols-outlined">
                            vpn_key
                        </span>
                        <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" placeholder="sua senha">
                        <label for="isenha">senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="#">Esqueci a senha</a>
                </div>
                </form>     
        </section>
    </main>
</body>
</html>
