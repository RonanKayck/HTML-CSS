<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <header>
        <p></p>
    </header>
    <main>
        <form action="index.html" method="post">
            <h1>Login</h1>
            <p class="ao">
                <label for="inome"><strong>Usuário:</strong> </label>
                <input type="text" name="nome" id="inome" maxlength="20" required>
            </p>
            <p class="ao">
                <label for="isenha"><strong>Senha:   </strong> </label>
                <input type="password" name="senha" id="isenha" minlength="8" maxlength="35" required>
            </p>
            <p id="entrar">
                <input type="submit" value="Entrar">
            </p>

        </form>
    </main>
</body>
</html>
