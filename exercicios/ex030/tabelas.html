<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        table {
            width: 500px;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid black;
            padding: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2">Área</th>
            <th rowspan="2">Disciplinas</th>
            <th colspan="2">Notas</th>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>MÉDIA</th>
        </tr>
        <tr>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <td>00</td>
            <td>eaw</td>
            <td>das</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>00</td>
            <td>10,00</td>
        </tr>
        <tr>
            <td>Matemática</td>
            <td>00</td>
        </tr>
    </table>
</body>
</html>
